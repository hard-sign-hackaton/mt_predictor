services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mt_predictor
      POSTGRES_USER: mt_predictor
      POSTGRES_PASSWORD: mt_predictor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mt_predictor -d mt_predictor"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - incident-data:/var/lib/postgresql/data
    restart: unless-stopped

  ml:
    build:
      context: ./ml
      args:
        INSTALL_ONNX_RUNTIME: "1"
    environment:
      TRANSFORMER_BACKEND: onnx
      MODEL_DEVICE: cpu
    ports:
      - "50051:50051"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
      - "9201:9201"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mt_predictor:mt_predictor@postgres:5432/mt_predictor?sslmode=disable
    command:
      - /app/mt-backend
      - -ndtp-addr
      - :9201
      - -http-addr
      - :8080
      - -catalog
      - /app/data/generated/route_catalog.json
      - -enable-mock-scenarios
    depends_on:
      ml:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_BACKEND_PROXY: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

  feeder:
    build:
      context: ./backend
    command:
      - /app/ndtpfeeder
      - -addr
      - backend:9201
      - -file
      - /dataset/validate/traffic.csv
      - -vehicles
      - "8"
      - -speed
      - "5"
      - -timestamp-mode
      - source
    volumes:
      - ../../dataset:/dataset:ro
    depends_on:
      - backend
    restart: on-failure

  mock-feeder:
    build:
      context: ./backend
    profiles: ["mock"]
    command:
      - /app/ndtpfeeder
      - -addr
      - backend:9201
      - -file
      - /demo/mock_telemetry.csv
      - -vehicles
      - "7"
      - -speed
      - "2"
      - -timestamp-mode
      - source
    volumes:
      - ./backend/data/mock_telemetry.csv:/demo/mock_telemetry.csv:ro
    depends_on:
      - backend
    restart: on-failure

  official-emulator:
    image: ndtp-telemetry-emulator:1.0
    platform: linux/amd64
    profiles: ["official-emulator"]
    ports:
      - "18080:18080"
    depends_on:
      - backend

volumes:
  incident-data:
